<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8B5CF6">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout">
</head>
<body>
  <svg width="0" height="0" style="position: absolute">
    <defs>
      <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8B5CF6" />
        <stop offset="100%" stop-color="#22D3EE" />
      </linearGradient>
    </defs>
  </svg>

  <main class="menu">
    <h1 class="menu-title">Workout Tracker</h1>

    <div class="day-card" data-day-id="lower-a">
      <div class="day-card-info">
        <span class="day-card-name">Lower A</span>
        <span class="day-card-label">Tuesday</span>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 44 44">
          <circle class="ring-track" cx="22" cy="22" r="18" />
          <circle class="ring-progress" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" />
        </svg>
        <span class="progress-text">0/0</span>
      </div>
    </div>

    <div class="day-card" data-day-id="upper-pull">
      <div class="day-card-info">
        <span class="day-card-name">Upper Pull</span>
        <span class="day-card-label">Wednesday</span>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 44 44">
          <circle class="ring-track" cx="22" cy="22" r="18" />
          <circle class="ring-progress" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" />
        </svg>
        <span class="progress-text">0/0</span>
      </div>
    </div>

    <div class="day-card" data-day-id="lower-b">
      <div class="day-card-info">
        <span class="day-card-name">Lower B</span>
        <span class="day-card-label">Thursday</span>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 44 44">
          <circle class="ring-track" cx="22" cy="22" r="18" />
          <circle class="ring-progress" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" />
        </svg>
        <span class="progress-text">0/0</span>
      </div>
    </div>

    <div class="day-card" data-day-id="upper-push">
      <div class="day-card-info">
        <span class="day-card-name">Upper Push</span>
        <span class="day-card-label">Friday</span>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 44 44">
          <circle class="ring-track" cx="22" cy="22" r="18" />
          <circle class="ring-progress" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" />
        </svg>
        <span class="progress-text">0/0</span>
      </div>
    </div>

    <div class="day-card" data-day-id="lower-c">
      <div class="day-card-info">
        <span class="day-card-name">Lower C</span>
        <span class="day-card-label">Saturday</span>
      </div>
      <div class="progress-ring">
        <svg viewBox="0 0 44 44">
          <circle class="ring-track" cx="22" cy="22" r="18" />
          <circle class="ring-progress" cx="22" cy="22" r="18" transform="rotate(-90 22 22)" />
        </svg>
        <span class="progress-text">0/0</span>
      </div>
    </div>

    <button class="reset-button" id="reset-button" type="button">Reset</button>
  </main>

  <div id="day-view" class="day-view hidden">
    <button class="back-button" id="back-button" type="button">&larr; Back</button>
    <h1 class="day-view-title" id="day-view-title"></h1>
    <ul class="exercise-list" id="exercise-list"></ul>

    <div class="day-progress">
      <div class="day-progress-track">
        <div class="day-progress-fill" id="day-progress-fill"></div>
      </div>
      <span class="day-progress-text" id="day-progress-text">0/0 exercises complete</span>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <div id="celebration-message">Day complete! 🎉</div>

  <script src="app.js"></script>
</body>
</html>
